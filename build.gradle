plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.2' apply false
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'architectury-plugin'

    group = rootProject.maven_group
    version = rootProject.mod_version

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'maven-publish'

    def isCommon = project.name == 'common'

    base {
        archivesName = "${rootProject.archives_name}-${rootProject.minecraft_version}-${project.name}"
    }

    repositories {
        maven { url 'https://maven.blamejared.com' }
        maven {
            name = 'Terraformers'
            url = 'https://maven.terraformersmc.com/'
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    }

    if (!isCommon) {
        apply plugin: 'com.gradleup.shadow'
        apply plugin: 'me.modmuss50.mod-publish-plugin'

        configurations {
            common {
                canBeResolved = true
                canBeConsumed = false
            }
            shadowCommon {
                canBeResolved = true
                canBeConsumed = false
            }
            compileClasspath.extendsFrom common
            runtimeClasspath.extendsFrom common
        }

        dependencies {
            common(project(path: ':common')) { transitive = false }
        }

        jar {
            archiveClassifier = 'raw'
        }

        shadowJar {
            dependsOn jar
            mainSpec.sourcePaths.clear()
            from(zipTree(tasks.jar.archiveFile))
            configurations = [project.configurations.shadowCommon]
            archiveClassifier = null
            zip64 = true
        }

        assemble.dependsOn shadowJar

        configurations {
            apiElements {
                outgoing.artifacts.clear()
                outgoing.artifact(project.tasks.shadowJar)
            }
            runtimeElements {
                outgoing.artifacts.clear()
                outgoing.artifact(project.tasks.shadowJar)
            }
        }

        sourcesJar {
            afterEvaluate {
                def commonSources = project(':common').sourcesJar
                dependsOn commonSources
                from(commonSources.archiveFile.map { zipTree(it) }) {
                    exclude 'architectury.accessWidener'
                }
            }
        }

        publishMods {
            file = project.tasks.shadowJar.archiveFile
            changelog = rootProject.file('changelog.md').getText('UTF-8')
            type = BETA
            modLoaders.add(project.name)
            displayName = "[${project.name.capitalize()} ${rootProject.minecraft_version}] ExoConfig ${rootProject.mod_version}"

            curseforge {
                projectId = '1294777'
                projectSlug = 'exoconfig'
                accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
                minecraftVersions.add(rootProject.minecraft_version)
                javaVersions.add(JavaVersion.VERSION_25)
            }

            modrinth {
                projectId = 'QsXGZyhd'
                accessToken = providers.environmentVariable('MODRINTH_TOKEN')
                minecraftVersions.add(rootProject.minecraft_version)
            }
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                groupId 'fr.tathan.exoconfig'
                artifactId "exoconfig-${project.name}-${rootProject.minecraft_version}"
                version project.version
                from components.java
                pom {
                    name = "ExoConfig ${project.name.capitalize()}"
                    url = 'https://github.com/TathanDev/ExoConfig'
                }
            }
        }

        repositories {
            maven {
                url = 'https://maven.exodusstudio.org/releases/'
                credentials {
                    username = System.getenv('EXODUS_MAVEN_USERNAME')
                    password = System.getenv('EXODUS_MAVEN_KEY')
                }
            }
        }
    }
}
